---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: flate

release:
  prerelease: auto

builds:
  - id: flate
    main: ./cmd/flate
    binary: flate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  algorithm: sha256
